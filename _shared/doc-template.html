<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$title$ — Titan Health</title>
<link rel="stylesheet" href="../_shared/styles.css">
<style>
  .doc-body {
    max-width: 880px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }
  .doc-body h1 {
    font-size: 32px;
    margin: 0 0 4px;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 12px;
  }
  .doc-body h2 {
    font-size: 24px;
    margin: 40px 0 16px;
    color: var(--accent-bright);
    border-bottom: 1px solid var(--border-subtle);
    padding-bottom: 6px;
  }
  .doc-body h3 {
    font-size: 19px;
    margin: 28px 0 10px;
    color: var(--text);
  }
  .doc-body h4 {
    font-size: 16px;
    margin: 20px 0 8px;
    color: var(--text-muted);
  }
  .doc-body p { color: var(--text); }
  .doc-body ul, .doc-body ol { padding-left: 22px; }
  .doc-body li { margin: 4px 0; color: var(--text); }
  .doc-body code {
    background: var(--code-bg);
    color: var(--accent-bright);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border-subtle);
    font-size: 13px;
  }
  .doc-body pre {
    background: var(--code-bg);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: 14px 0;
  }
  .doc-body pre code {
    background: transparent;
    border: none;
    padding: 0;
    font-size: 13px;
    line-height: 1.55;
  }
  .doc-body table {
    border-collapse: collapse;
    margin: 18px 0;
    width: 100%;
    font-size: 14px;
  }
  .doc-body table th,
  .doc-body table td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
  }
  .doc-body table th {
    background: var(--bg-elev);
    color: var(--accent-bright);
    font-weight: 600;
  }
  .doc-body table tr:nth-child(even) td { background: var(--bg-elev); }
  .doc-body blockquote {
    border-left: 3px solid var(--accent);
    background: var(--bg-elev);
    padding: 12px 18px;
    margin: 18px 0;
    border-radius: 0 6px 6px 0;
    color: var(--text-muted);
  }
  .doc-body blockquote p { margin: 6px 0; }
  .doc-body hr {
    border: none;
    border-top: 1px solid var(--border-subtle);
    margin: 32px 0;
  }
  .doc-body a { color: var(--accent-bright); }
  .doc-body a:hover { color: var(--accent); text-decoration: underline; }
  .doc-meta {
    color: var(--text-dim);
    font-size: 13px;
    margin: 4px 0 24px;
  }
</style>
</head>
<body>
<div class="container">

  <nav class="nav">
    <a href="./">← Titan Health</a>
  </nav>

  <article class="doc-body">
$body$
  </article>

  <footer class="page-footer">
    <p>Titan Health — Salesforce Release 3 documentation. Last updated 2026-05-01.</p>
  </footer>

</div>
</body>
</html>
